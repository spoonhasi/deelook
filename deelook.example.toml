# deelook 설정 파일 (deelook.exe 옆 deelook.toml)
#
# 여기 적힌 값이 지금 쓰이는 값입니다. 처음 실행할 때 기본값으로 만들어지고, 고치면 다음 실행부터 적용됩니다.
# 이 파일을 지우면 다음 실행 때 기본값으로 다시 만들어집니다.
# 이름은 명령줄 옵션(deelook -h)과 같고, 명령줄로 준 값이 이 파일보다 우선합니다.
# 문자열은 "큰따옴표" 안에 씁니다. 윈도우 경로는 '작은따옴표' 안에 쓰면 \ 를 그대로 쓸 수 있습니다.
# 줄에서 # 뒤는 설명입니다.

# deemesh-hub 주소
hub = "http://127.0.0.1:8080"

# 웹 서버 주소
#   ":8090"           이 PC의 모든 네트워크 (다른 PC에서도 접속, 처음에 방화벽이 물어볼 수 있음)
#   "127.0.0.1:8090"  이 PC에서만
listen = ":8090"

# 주소에 machine 이 없을 때 HMI 화면에 보여 줄 기계: deemesh-hub의 machine_id(1) 또는 이름("bench-31i"),
# "" 면 허브 목록에서 번호가 가장 작은 FANUC 기계
machine = ""

# HMI 화면을 허브에서 읽는 간격, 한 번 읽을 때 허브 쪽 제한 시간
interval = "1s"
timeout = "5s"

# 데이터 폴더. 상대 경로는 이 파일이 있는 폴더 기준
#   sessions\   수집 한 건마다 SQLite 파일 하나 (넘겨줄 때는 그 파일만)
#   deelook.db  deelook 내부용: 세션 목록, 세션 번호, 기계 목록과 IP (넘겨주지 않음)
data = "deelook-data"

# 데이터 폴더가 있는 디스크의 남은 공간이 이보다 적으면 수집을 시작하지 않고, 수집 중이면 멈춤. "0" 이면 보지 않음
minfree = "1GB"

# FANUC FOCAS2 라이브러리 파일. "" 이면 deelook.exe 옆에서 찾음 (Windows Fwlib64.dll, 리눅스 libfwlib32.so*)
# 다른 곳에 있으면 예: fwlib = 'C:\FANUC\Fwlib64.dll'  (같은 폴더에 fwlibe64.dll 도 있어야 함)
fwlib = ""

# 시작하면 브라우저로 도움말(/) 열기
#   "auto" = 더블클릭으로 실행했을 때만,  true = 항상,  false = 열지 않음
open = "auto"

# 조작반 램프를 PMC Y 신호로 읽을 기계: deemesh-hub의 machine_id = "프로파일"
# 프로파일은 지금 "ncguide"(NC Guide 표준 조작반 래더) 하나입니다. 여기 없는 기계는 deemesh 공통 상태값으로 램프를 켭니다.
# 예 (# 을 지우면 적용):
#   1 = "ncguide"
#   13 = "ncguide"
[lamps]
