# deelook 설정 파일
#
# deelook.exe 옆에 deelook.toml 이라는 이름으로 두면 시작할 때 읽습니다. 없으면 모두 기본값입니다.
# 아래는 기본값을 적어 둔 것이라, 바꿀 줄만 앞의 # 을 지우고 고치면 됩니다.
# 명령줄 옵션(deelook -h)과 이름이 같고, 명령줄에 준 값이 이깁니다.
# 문자열은 "따옴표" 안에 씁니다. 윈도우 경로는 '작은따옴표' 안에 쓰면 \ 를 그대로 쓸 수 있습니다.

# deemesh-hub 주소
# hub = "http://127.0.0.1:8080"

# 웹 서버 주소
#   ":8090"           이 PC의 모든 네트워크 (다른 PC에서도 접속, 처음에 방화벽이 물어볼 수 있음)
#   "127.0.0.1:8090"  이 PC에서만
# listen = ":8090"

# 주소에 machine 이 없을 때 HMI 화면에 보여 줄 기계 (machine_id 또는 이름)
# machine = 1

# HMI 화면을 허브에서 읽는 간격, 한 번 읽을 때 허브 쪽 제한 시간
# interval = "1s"
# timeout = "5s"

# 수집 데이터 (SQLite). 상대 경로는 이 파일이 있는 폴더 기준
# db = "deelook-data/sampling.db"

# FANUC FOCAS2 라이브러리. 비우면 deelook.exe 옆 Fwlib64.dll (리눅스는 libfwlib32.so*)
# fwlib = 'C:\FANUC\Fwlib64.dll'

# 시작하면 브라우저로 화면 열기. 비우면 더블클릭으로 실행했을 때만 엶
# open = false

# 조작반 램프를 PMC Y 신호로 읽을 기계: machine_id = "프로파일"
# 프로파일은 지금 "ncguide"(NC Guide 표준 조작반 래더) 하나. 없는 기계는 deemesh 공통 상태값으로 켬
# [lamps]
# 1 = "ncguide"
# 13 = "ncguide"
